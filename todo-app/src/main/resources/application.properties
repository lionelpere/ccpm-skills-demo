# Application Name
spring.application.name=todo-backend

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:todoapp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development/demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your-256-bit-secret-change-in-production-use-env-variable
jwt.expiration=86400000

# CORS Configuration (allow frontend)
cors.allowed.origins=http://localhost:5173

# Logging
logging.level.com.todoapp=DEBUG
logging.level.org.springframework.security=DEBUG
